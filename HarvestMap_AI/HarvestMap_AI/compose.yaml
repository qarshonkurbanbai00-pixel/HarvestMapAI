services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: harvestmap
      POSTGRES_USER: harvestmap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harvestmap -d harvestmap"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://harvestmap:${POSTGRES_PASSWORD}@db:5432/harvestmap
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
